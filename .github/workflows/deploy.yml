name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Determine base href
        id: pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          USER_SITE_REPO="${GITHUB_REPOSITORY_OWNER}.github.io"

          if [[ "$REPO_NAME" == "$USER_SITE_REPO" ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPO_NAME}/"
          fi

          echo "base_href=${BASE_HREF}" >> "$GITHUB_OUTPUT"
          echo "Repository owner: ${GITHUB_REPOSITORY_OWNER}"
          echo "Repository name: ${REPO_NAME}"
          echo "Using base href: ${BASE_HREF}"

      - name: Build Flutter web
        run: |
          flutter build web \
            --release \
            --base-href="${{ steps.pages.outputs.base_href }}"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Verify Flutter web build
        run: |
          echo "Generated index base href:"
          grep -n "<base" build/web/index.html || true

          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/manifest.json
          test -f build/web/favicon.png

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
